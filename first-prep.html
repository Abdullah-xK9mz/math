<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصف الأول الإعدادي | سلسلة أنت والرياضيات</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/pvxkcrPf/logo.png">
    
    <!-- ربط مكتبات Firebase (متوافقة مع الإصدار 10 المستخدم في لوحة التحكم) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // نفس إعدادات قاعدة البيانات الخاصة بمشروعك
        const firebaseConfig = {
            databaseURL: "https://math-9cde7-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // حماية الصفحة والتأكد من تسجيل الدخول
        window.onload = function() {
            const savedCode = localStorage.getItem('activeStudentCode');
            const savedGrade = localStorage.getItem('activeStudentGrade');
            
            // ملاحظة: لو كنت بتخزن الصف بصيغة مختلفة في التخزين المحلي، عدل الشرط ده بما يناسب كود صفحة الدخول بتاعتك
            if (!savedCode) {
                window.location.href = "index.html";
                return;
            }

            loadStudentLessons(db);
        };

        async function loadStudentLessons(db) {
            const container = document.getElementById('lessonsContainer');
            
            try {
                // سحب الدروس من المسار الخاص بالصف الأول الإعدادي في قاعدة البيانات
                const lessonsRef = ref(db, 'lessons/first-prep');
                const snapshot = await get(lessonsRef);

                container.innerHTML = "";

                if (!snapshot.exists()) {
                    container.innerHTML = '<div class="no-lessons">لا توجد دروس مضافة حالياً في هذا الصف.</div>';
                    return;
                }

                const unitsData = snapshot.val();
                let globalCounter = 1;

                // التكرار على الوحدات (unit_1, unit_2, ...)
                for (let unitKey in unitsData) {
                    const unitLessons = unitsData[unitKey];

                    // عنوان الوحدة التوضيحي
                    let unitTitleFormatted = "الوحدة الدراسية";
                    if (unitKey === "unit_1") unitTitleFormatted = "الوحدة الأولى";
                    else if (unitKey === "unit_2") unitTitleFormatted = "الوحدة الثانية";
                    else if (unitKey === "unit_3") unitTitleFormatted = "الوحدة الثالثة";
                    else if (unitKey === "unit_4") unitTitleFormatted = "الوحدة الرابعة";
                    else if (unitKey === "unit_5") unitTitleFormatted = "الوحدة الخامسة";

                    const unitHeading = document.createElement('h3');
                    unitHeading.className = 'unit-title-heading';
                    unitHeading.innerText = unitTitleFormatted;
                    container.appendChild(unitHeading);

                    // التكرار على الدروس جوه الوحدة دي
                    for (let lessonKey in unitLessons) {
                        const lesson = unitLessons[lessonKey];
                        
                        let rawUrl = lesson.url || "";
                        let embedUrl = rawUrl;

                        // معالجة روابط يوتيوب لتحويلها لصيغة الـ Embed لو المستخدم حط رابط عادي
                        if (rawUrl.includes("watch?v=")) {
                            embedUrl = rawUrl.replace("watch?v=", "embed/");
                        } else if (rawUrl.includes("youtu.be/")) {
                            embedUrl = rawUrl.replace("youtu.be/", "www.youtube-nocookie.com/embed/");
                        } else if (!rawUrl.includes("embed/") && rawUrl.includes("youtube.com")) {
                            // لو رابط يوتيوب بالشكل العادي
                            const urlParts = rawUrl.split('/');
                            const videoId = urlParts[urlParts.length - 1].split('?')[0];
                            if (videoId) embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}`;
                        }

                        const lessonCard = document.createElement('div');
                        lessonCard.className = 'lesson-card';
                        lessonCard.innerHTML = `
                            <div class="lesson-header">
                                <span class="lesson-badge">الدرس ${globalCounter}</span>
                                <h3>${lesson.title || "بدون عنوان"}</h3>
                            </div>
                            <div class="video-container">
                                <iframe src="${embedUrl}" 
                                        title="${lesson.title || ""}" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                        allowfullscreen>
                                </iframe>
                            </div>
                        `;
                        container.appendChild(lessonCard);
                        globalCounter++;
                    }
                }

                if (globalCounter === 1) {
                    container.innerHTML = '<div class="no-lessons">لا توجد دروس مضافة حالياً في هذا الصف.</div>';
                }

            } catch (error) {
                console.error("خطأ أثناء جلب الدروس:", error);
                container.innerHTML = '<div class="no-lessons" style="color: #b83232;">حدث خطأ أثناء تحميل الدروس، يرجى تحديث الصفحة.</div>';
            }
        }

        window.logout = function() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "index.html";
        }
    </script>
