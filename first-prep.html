<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصف الأول الإعدادي | سلسلة أنت والرياضيات</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/pvxkcrPf/logo.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Traditional Arabic", "Simplified Arabic", "Times New Roman", Arial, Tahoma, sans-serif;
        }
        body {
            background-color: #000000;
            color: #d1bfa9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: 'f(x) = ∫ e^x dx   ∑ (n=1 to ∞)   π ≈ 3.14159   Δ = b² - 4ac   sin²θ + cos²θ = 1   √x   dy/dx';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 16px;
            color: rgba(212, 175, 55, 0.015);
            word-spacing: 30px;
            line-height: 60px;
            z-index: -2;
            user-select: none;
            overflow: hidden;
            padding: 15px;
        }
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.97) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: -1;
        }
        header {
            background-color: #0a0a0a;
            color: #f3e9dc;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #261c14;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .site-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #d4af37;
            background-color: #000000;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .site-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-area h1 {
            font-size: 19px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.2;
        }
        .logo-area h1 .math-text {
            color: #d4af37;
        }
        .logo-area h1 .author-sub {
            display: block;
            font-size: 12px;
            color: #a38f78;
            font-weight: normal;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .portal-badge {
            font-size: 13px;
            background: #14100c;
            color: #d4af37;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #261c14;
            font-weight: bold;
            white-space: nowrap;
        }
        .logout-btn {
            background: #261c14;
            color: #e06d6d;
            border: 1px solid #3d2b1f;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .logout-btn:hover {
            background: #3d2b1f;
        }
        .container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 15px;
        }
        .page-title {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 25px;
            border-right: 4px solid #d4af37;
            padding-right: 12px;
            font-weight: bold;
        }
        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .lesson-card {
            background: #0d0d0d;
            border: 1px solid #261c14;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
        }
        .lesson-header {
            background: #14100c;
            padding: 14px 20px;
            border-bottom: 1px solid #261c14;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .lesson-badge {
            background-color: #d4af37;
            color: #000;
            font-weight: bold;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }
        .lesson-header h3 {
            font-size: 18px;
            color: #ffffff;
            font-weight: bold;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* نسبة 16:9 عشان الفيديو يملى الشاشة تماماً */
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #0a0a0a;
            color: #8c7862;
            font-size: 12px;
            border-top: 1px solid #261c14;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: auto;
        }
        .footer-logo {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #d4af37;
            background-color: #000;
        }
        .footer-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (min-width: 769px) {
            header { padding: 20px 40px; }
            .site-logo { width: 65px; height: 65px; }
            .logo-area { gap: 20px; }
            .logo-area h1 { font-size: 26px; }
            .logo-area h1 .author-sub { font-size: 16px; }
            .portal-badge { font-size: 16px; padding: 8px 18px; }
            .container { padding: 40px 20px; }
            .page-title { font-size: 30px; margin-bottom: 30px; }
            .lesson-header { padding: 18px 25px; }
            .lesson-header h3 { font-size: 21px; }
            footer { font-size: 15px; padding: 20px; }
            .footer-logo { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="site-logo">
                <img src="https://i.ibb.co/pvxkcrPf/logo.png" alt="شعار أنت والرياضيات">
            </div>
            <h1>
                أنت <span class="math-text">والرياضيات</span>
                <span class="author-sub">الاستاذ / السيد التابعى</span>
            </h1>
        </div>
        <div class="header-actions">
            <div class="portal-badge">الصف الأول الإعدادي</div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
    </header>

    <div class="container">
        <h2 class="page-title">دروس وفيديوهات الصف الأول الإعدادي</h2>
        
        <div class="lessons-list">

            <!-- ========================================== -->
            <!--   مكان إضافة الدرس الأول                    -->
            <!-- ========================================== -->
            <div class="lesson-card">
                <div class="lesson-header">
                    <span class="lesson-badge">الدرس الأول</span>
                    <!-- اكتب اسم الدرس هنا -->
                    <h3>مجموعة الأعداد النسبية</h3>
                </div>
                <div class="video-container">
                    <!-- حط كود الـ iframe الكامل هنا (اللي بتاخده من تضمين يوتيوب) -->
                    <iframe src="https://www.youtube-nocookie.com/embed/رابط_الفيديو_هنا" 
                            title="الدرس الأول" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                    </iframe>
                </div>
            </div>


            <!-- ========================================== -->
            <!--   مكان إضافة الدرس الثاني                   -->
            <!-- ========================================== -->
            <div class="lesson-card">
                <div class="lesson-header">
                    <span class="lesson-badge">الدرس الثاني</span>
                    <!-- اكتب اسم الدرس هنا -->
                    <h3>مقارنة وترتيب الأعداد النسبية</h3>
                </div>
                <div class="video-container">
                    <!-- حط كود الـ iframe الكامل هنا (اللي بتاخده من تضمين يوتيوب) -->
                    <iframe src="https://www.youtube-nocookie.com/embed/رابط_الفيديو_هنا" 
                            title="الدرس الثاني" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                    </iframe>
                </div>
            </div>


            <!-- تقدر تنسخ وتلصق نفس الكتل دي لأي عدد جديد من الدروس -->

        </div>
    </div>

    <footer>
        <div class="footer-logo">
            <img src="https://i.ibb.co/pvxkcrPf/logo.png" alt="شعار سفلي">
        </div>
        <div>جميع الحقوق محفوظة © سلسلة أنت والرياضيات 2026</div>
    </footer>

    <script>
        // كود حماية بسيط عشان لو الطالب مش مسجل كود يرجع لصفحة الدخول
        window.onload = function() {
            const savedCode = localStorage.getItem('activeStudentCode');
            const savedGrade = localStorage.getItem('activeStudentGrade');
            
            if (!savedCode || savedGrade !== "prep_1") {
                window.location.href = "index.html";
            }
        };

        function logout() {
            localStorage.removeItem('activeStudentCode');
            localStorage.removeItem('activeStudentGrade');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
